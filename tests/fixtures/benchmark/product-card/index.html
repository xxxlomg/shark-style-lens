<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Benchmark: Product Card</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 32px; background: #f8fafc; }
      .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 760px; }
      .product {
        display: flex; flex-direction: column; gap: 10px;
        border: 1px solid #e2e8f0; border-radius: 14px; padding: 16px; background: #fff;
      }
      .product .thumb { height: 120px; border-radius: 10px; background: linear-gradient(135deg, #e0e7ff, #c7d2fe); }
      .product h4 { margin: 0; font-size: 15px; }
      .product .meta { display: flex; justify-content: space-between; align-items: center; }
      .product .price { font-weight: 700; color: #0f172a; }
      .product .btn { background: #0f172a; color: #fff; border: 0; border-radius: 8px; padding: 7px 12px; font-size: 12px; font-weight: 600; }
    </style>
  </head>
  <body>
    <h1>Product Card</h1>
    <div class="grid">
      <div class="product">
        <div class="thumb"></div>
        <h4>Minimal Desk Lamp</h4>
        <div class="meta"><span class="price">$89</span><button class="btn" type="button">Add</button></div>
      </div>
      <div class="product">
        <div class="thumb"></div>
        <h4>Ceramic Mug Set</h4>
        <div class="meta"><span class="price">$32</span><button class="btn" type="button">Add</button></div>
      </div>
      <div class="product">
        <div class="thumb"></div>
        <h4>Linen Throw Pillow</h4>
        <div class="meta"><span class="price">$45</span><button class="btn" type="button">Add</button></div>
      </div>
    </div>
  </body>
</html>
