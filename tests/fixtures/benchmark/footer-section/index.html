<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Benchmark: Footer Section</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; background: #0f172a; color: #cbd5e1; }
      footer {
        display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 32px;
        padding: 48px 32px 24px; background: #0f172a;
      }
      footer .brand { font-size: 16px; font-weight: 800; color: #fff; }
      footer .desc { font-size: 13px; color: #94a3b8; margin-top: 8px; max-width: 240px; line-height: 1.6; }
      footer h5 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: #64748b; margin: 0 0 12px; }
      footer ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
      footer a { color: #cbd5e1; text-decoration: none; font-size: 13px; }
      footer .copy { grid-column: 1 / -1; border-top: 1px solid #1e293b; padding-top: 16px; font-size: 12px; color: #64748b; }
    </style>
  </head>
  <body>
    <footer>
      <div>
        <div class="brand">Acme Inc.</div>
        <p class="desc">Build better products with the tools your team already trusts.</p>
      </div>
      <div>
        <h5>Product</h5>
        <ul><li><a href="#">Features</a></li><li><a href="#">Pricing</a></li><li><a href="#">Changelog</a></li></ul>
      </div>
      <div>
        <h5>Company</h5>
        <ul><li><a href="#">About</a></li><li><a href="#">Blog</a></li><li><a href="#">Careers</a></li></ul>
      </div>
      <div>
        <h5>Legal</h5>
        <ul><li><a href="#">Privacy</a></li><li><a href="#">Terms</a></li></ul>
      </div>
      <div class="copy">© 2026 Acme Inc. All rights reserved.</div>
    </footer>
  </body>
</html>
