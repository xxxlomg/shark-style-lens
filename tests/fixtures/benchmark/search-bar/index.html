<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Benchmark: Search Bar</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 32px; background: #f8fafc; }
      .search {
        display: flex; align-items: center; gap: 10px; max-width: 360px;
        border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px 14px; background: #fff;
        box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
      }
      .search svg { color: #94a3b8; flex: none; }
      .search input { flex: 1; border: 0; outline: 0; font-size: 14px; }
      .search .kbd {
        flex: none; padding: 2px 6px; border: 1px solid #e2e8f0; border-radius: 5px;
        font-size: 11px; color: #94a3b8; background: #f8fafc;
      }
    </style>
  </head>
  <body>
    <h1>Search Bar</h1>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="text" placeholder="Search docs…" />
      <span class="kbd">⌘K</span>
    </div>
  </body>
</html>
