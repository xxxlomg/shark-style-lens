<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Benchmark: Navbar</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; background: #f8fafc; }
      nav {
        display: flex; align-items: center; justify-content: space-between; gap: 24px;
        padding: 0 24px; height: 60px; background: #0f172a; color: #e2e8f0;
        border-bottom: 1px solid #1e293b;
      }
      nav .logo { font-weight: 800; font-size: 16px; color: #fff; }
      nav .links { display: flex; gap: 20px; font-size: 14px; }
      nav .links a { color: #cbd5e1; text-decoration: none; }
      nav .cta { background: #6366f1; color: #fff; border: 0; border-radius: 8px; padding: 8px 16px; font-size: 13px; font-weight: 600; }
    </style>
  </head>
  <body>
    <nav>
      <span class="logo">Acme</span>
      <div class="links">
        <a href="#">Home</a><a href="#">Docs</a><a href="#">Pricing</a><a href="#">Blog</a>
      </div>
      <button class="cta" type="button">Sign Up</button>
    </nav>
    <h1>Navbar</h1>
  </body>
</html>
