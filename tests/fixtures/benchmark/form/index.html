<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Benchmark: Form</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 32px; background: #f8fafc; }
      form {
        display: flex; flex-direction: column; gap: 14px; max-width: 320px;
        border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; background: #fff;
      }
      form label { font-size: 13px; font-weight: 600; color: #334155; }
      form input {
        padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px;
      }
      form input:focus { outline: 2px solid #6366f1; border-color: transparent; }
      form button { background: #6366f1; color: #fff; border: 0; border-radius: 8px; padding: 10px; font-size: 14px; font-weight: 600; }
    </style>
  </head>
  <body>
    <h1>Form</h1>
    <form>
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com" />
      <label for="pwd">Password</label>
      <input id="pwd" type="password" placeholder="••••••••" value="supersecret" />
      <button type="submit">Create Account</button>
    </form>
  </body>
</html>
